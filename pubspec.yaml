name: weighwell
description: Weigh your food, see calories and protein, and plan your daily meals. iOS, Android and web.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  flutter_blue_plus: ^1.34.5
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
